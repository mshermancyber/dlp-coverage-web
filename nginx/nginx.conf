# HTTP → HTTPS redirect
# Note: uses $server_port so the redirect works regardless of host port mapping.
server {
    listen 80;
    server_name _;

    # If the original request arrived via port 8080, redirect to 8443.
    # Falls back to standard 443 if mapped differently.
    set $redirect_port 8443;
    if ($server_port = 80) {
        set $redirect_port 8443;
    }

    return 301 https://$host:$redirect_port$request_uri;
}

# HTTPS application server
server {
    listen 443 ssl http2;
    server_name _;

    # Self-signed cert (generated at container startup; override with volume mount for prod)
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    root /var/www/dlp-coverage-map;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # SPA — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS/CSS hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Disable access log for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
